services:
  db:
    image: postgres:16
    container_name: paylite-db
    environment:
      POSTGRES_DB: paylite
      POSTGRES_USER: paylite
      POSTGRES_PASSWORD: paylite_pass
    ports:
      - "5432:5432"
    volumes:
      - paylite-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylite -d paylite"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  paylite-data: